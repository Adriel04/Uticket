{% extends "base.html" %}

{% block title %} Reload {% endblock %}

{% block content %}

    <div id="mainBox">
        <form action="{% url 'recharge' user_id=user_id %}" method="post">
            {% csrf_token %}
            <h2>Desired Amount</h1>
            <input type="number" name="amount" min="1" required>
            <button type="submit">Accept</button>
        </form>
    </div>
    
{%  endblock%}
